{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Reset Password - Lifespring Medical Center</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700&family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; }
        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(135deg, #063ea6, #0d8b9a);
        }
        .card {
            width: 100%;
            max-width: 430px;
            padding: 35px;
            border-radius: 15px;
            background: white;
            box-shadow: 0 10px 35px rgba(0,0,0,.2);
        }
        h1 {
            margin-top: 0;
            color: #063ea6;
            font: 700 25px 'Montserrat', sans-serif;
            text-align: center;
        }
        p { color: #555; font-size: 14px; line-height: 1.7; }
        label { display: block; margin: 18px 0 7px; font-weight: 600; }
        input[type="email"] {
            width: 100%;
            padding: 13px;
            border: 1px solid #ccd3df;
            border-radius: 7px;
            font: inherit;
        }
        button {
            width: 100%;
            margin-top: 20px;
            padding: 13px;
            border: 0;
            border-radius: 7px;
            background: #063ea6;
            color: white;
            font: 600 15px 'Montserrat', sans-serif;
            cursor: pointer;
        }
        button:hover { background: #0d4fc9; }
        .back { display: block; margin-top: 20px; text-align: center; color: #063ea6; text-decoration: none; }
        .errorlist { color: #b42318; font-size: 13px; padding-left: 20px; }
    </style>
</head>
<body>
    <main class="card">
        <h1>Forgot Password?</h1>
        <p>Enter the email address associated with your account. If an eligible account exists, Django will send instructions to reset your password.</p>

        <form method="post">
            {% csrf_token %}
            {{ form.email.errors }}
            <label for="{{ form.email.id_for_label }}">Email address</label>
            {{ form.email }}
            <button type="submit">Send Reset Link</button>
        </form>

        <a class="back" href="{% url 'login' %}">Back to Login</a>
    </main>
</body>
</html>
