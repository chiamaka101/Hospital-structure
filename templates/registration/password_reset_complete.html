<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Password Reset Complete - Lifespring Medical Center</title>
    <style>
        * { box-sizing: border-box; }
        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #063ea6, #0d8b9a);
        }
        .card {
            max-width: 430px;
            width: 100%;
            padding: 35px;
            border-radius: 15px;
            background: white;
            text-align: center;
            box-shadow: 0 10px 35px rgba(0,0,0,.2);
        }
        h1 { color: #063ea6; }
        p { color: #555; line-height: 1.7; }
        a {
            display: inline-block;
            margin-top: 15px;
            padding: 12px 20px;
            border-radius: 7px;
            background: #063ea6;
            color: white;
            text-decoration: none;
        }
    </style>
</head>
<body>
    <main class="card">
        <h1>Password Updated</h1>
        <p>Your password has been reset successfully. You can now log in using your new password.</p>
        <a href="{% url 'login' %}">Return to Login</a>
    </main>
</body>
</html>
