{% load static %}
<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Lifespring Hospital - Login</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700&family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        *{ 
            margin: 0; 
            padding: 0;
            box-sizing: border-box; 
            user-select: none;
        }
        .bg-img{ 
            background: url('https://images.unsplash.com/photo-1576091160399-112ba8d25d1d');
            height: 100vh;
            background-size: cover;
            background-position: center;
            position: relative;
        }
        .bg-img::after{ 
            position: absolute; 
            content: '';
            top: 0;
            height: 100%;
            left: 0;
            width: 100%; 
            background: rgba(0, 0, 0, 0.3);
        }
        .content{
            position: absolute;
            top: 50%;
            left: 50%;
            z-index: 999;
            text-align: center;
            padding: 40px 30px 60px;
            width: 400px;
            transform: translate(-50%,-50%);
            background: rgba(255, 255, 255, 0.15); 
            box-shadow: 1px 4px 28px 0px rgba(0, 0, 0, 0.75);
            border-radius: 15px;
            backdrop-filter: blur(8px);
        }
        /* Logo Header Styling */
        .login-header {
            margin-bottom: 25px;
        }
        .login-header img {
            width: 120px;
            height: 120px;
            object-fit: contain;
            margin-bottom: 15px;
            filter: drop-shadow(0 4px 8px rgba(0,0,0,0.3));
        }
        .login-header h1 {
            color: #ffffff;
            font-size: 32px; 
            font-weight: 700; 
            font-family: 'Montserrat', sans-serif;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.5);
            margin: 0;
            letter-spacing: 1px;
        }
        .login-header p {
            color: rgba(255, 255, 255, 0.9);
            font-size: 14px;
            font-family: 'Poppins', sans-serif;
            margin-top: 5px;
        }
        .field{ 
            position: relative;
            height: 45px;
            width: 100%;
            display: flex;
            background: rgba(255, 255, 255, 0.95);
            border-radius: 8px;
            margin-bottom: 15px;
            overflow: hidden;
        }
        .field i{ 
            color: #063ea6; 
            width: 45px; 
            line-height: 45px;
            font-size: 18px;
        } 
        .field input{ 
            height: 100%;
            width: 100%; 
            background: transparent;
            border: none;
            outline: none; 
            color: #222;
            font-size: 16px; 
            font-family: 'Poppins', sans-serif;
            padding-right: 10px;
        }
        .show{
            position: absolute;
            right: 12px; 
            top: 15px;
            font-weight: 700;
            font-size: 13px;
            color: #063ea6;
            font-family: 'Montserrat', sans-serif; 
            display: none;
            cursor: pointer;
        }
        .pass-key:valid ~ .show{
            display: block;
        }
        .pass{ 
            text-align: right;
            margin: 10px 0 20px;
        }
        .pass a{ 
            font-size: 13px; 
            color: white; 
            text-decoration: none;
            font-family: 'Poppins', sans-serif; 
        }
        .pass a:hover{
            text-decoration: underline;
        }
        .field input[type="submit"]{ 
            background: #063ea6;
            border: none;
            letter-spacing: 1px; 
            color: rgb(255, 255, 255);
            font-size: 18px; 
            font-weight: 600; 
            cursor: pointer; 
            font-family: 'Montserrat', sans-serif;
            transition: all 0.3s;
        }
        .field input[type="submit"]:hover{ 
            background: #0d4fc9;
            box-shadow: 0 4px 15px rgba(6, 62, 166, 0.4);
        }
        .signup{ 
            font-size: 15px; 
            color: white;
            font-family: 'Poppins', sans-serif;
            margin-top: 20px;
        } 
        .signup a{ 
            text-decoration: none; 
            color: #20eec7;
            font-weight: 600;
        }
        .signup a:hover{
            text-decoration: underline;
        }
        .alert {
            background: rgba(220, 53, 69, 0.9);
            color: white;
            padding: 10px;
            border-radius: 8px;
            margin-bottom: 15px;
            font-family: 'Poppins', sans-serif;
            font-size: 14px;
        }
    </style>
</head>
<body>
    <div class="bg-img">
        <div class="content">
            <div class="login-header">
                
            
                <h1>LIFESPRING</h1>
                <p>Medical Center</p>
            </div>
            
            {% if messages %}
                {% for message in messages %}
                    <div class="alert">{{ message }}</div>
                {% endfor %}
            {% endif %}

            <form method="post" action="{% url 'login' %}">
                {% csrf_token %}
                <div class="field">
                    <i class="bi bi-envelope"></i>
                    <input type="email" name="email" required placeholder="Email Address">
                </div>
                <div class="field">
                    <i class="bi bi-lock"></i>
                    <input type="password" class="pass-key" name="password" required placeholder="Password">
                    <span class="show">SHOW</span>
                </div>
                <div class="pass">
                    <a href="{% url 'password_reset' %}">Forgot Password?</a>
                </div>

                <div class="field">
                    <input type="submit" value="LOGIN">
                </div>
            </form>
            
            <div class="signup">
                Don't have an account? <a href="{% url 'register' %}">Sign Up</a>
            </div>
        </div>
    </div>

    <script>
    const passwordInput = document.querySelector('.pass-key');
    const showButton = document.querySelector('.show');

    showButton.addEventListener('click', function () {
        if (passwordInput.type === 'password') {
            passwordInput.type = 'text';
            showButton.textContent = 'HIDE';
        } else {
            passwordInput.type = 'password';
            showButton.textContent = 'SHOW';
        }
    });
</script>
</body>
</html>
