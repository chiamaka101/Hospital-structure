{% load static %}
<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Register - lifespring Hospital</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700&family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        *{ 
            margin: 0; 
            padding: 0;
            box-sizing: border-box; 
        }
        .bg-img{ 
            background: url('https://images.unsplash.com/photo-1586773860418-d37222d8fce3?w=1920&q=80');
            min-height: 100vh;
            background-size: cover;
            background-position: center;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 40px 20px;
        }
        .bg-img::after{ 
            position: absolute; 
            content: '';
            top: 0;
            height: 100%;
            left: 0;
            width: 100%; 
            background: rgba(0, 0, 0, 0.5);
        }
        .content{
            position: relative;
            z-index: 999;
            padding: 40px 30px;
            width: 450px;
            background: rgba(255, 255, 255, 0.1); 
            box-shadow: 1px 4px 28px 0px rgba(0, 0, 0, 0.75);
            border-radius: 10px;
            backdrop-filter: blur(5px);
        }
        .content header { 
            color: rgb(39, 243, 243);
            font-size: 32px; 
            font-weight: 600; 
            margin-bottom: 25px; 
            font-family: 'Montserrat', sans-serif;
            text-align: center;
        }
        .content form p {
            margin-bottom: 15px;
        }
        .content form label {
            color: white;
            font-family: 'Poppins', sans-serif;
            font-size: 14px;
            display: block;
            margin-bottom: 5px;
        }
        .content form input,
        .content form select {
            width: 100%;
            height: 42px;
            background: rgba(255, 255, 255, 0.9);
            border: none;
            outline: none;
            border-radius: 5px;
            padding: 0 12px;
            color: #222;
            font-size: 15px;
            font-family: 'Poppins', sans-serif;
        }
        .content form .helptext,
        .content form ul {
            display: none;
        }
        .content form button {
            width: 100%;
            height: 45px;
            background: #063ea6;
            border: 1px solid #041e4e;
            border-radius: 5px;
            letter-spacing: 1px; 
            color: rgb(255, 255, 255);
            font-size: 18px; 
            font-weight: 600; 
            cursor: pointer; 
            font-family: 'Montserrat', sans-serif;
            margin-top: 10px;
        }
        .content form button:hover { 
            background: #5885da;
        }
        .errorlist {
            color: #ff6b6b;
            font-size: 13px;
            list-style: none;
            padding: 5px 0;
            margin: 5px 0;
            font-family: 'Poppins', sans-serif;
        }
        .alert {
            background: rgba(220, 53, 69, 0.9);
            color: white;
            padding: 10px;
            border-radius: 5px;
            margin-bottom: 15px;
            font-family: 'Poppins', sans-serif;
            font-size: 14px;
        }
        .login-link { 
            font-size: 15px; 
            color: white;
            font-family: 'Poppins', sans-serif;
            text-align: center;
            margin-top: 20px;
        } 
        .login-link a { 
            text-decoration: none; 
            color: #20eec7;
        }
        .login-link a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <div class="bg-img">
        <div class="content">
            <header><i class="bi bi-person-plus"></i> Create Account</header>
            
            {% if messages %}
                {% for message in messages %}
                    <div class="alert">{{ message }}</div>
                {% endfor %}
            {% endif %}

            <form method="post">
                {% csrf_token %}
                {{ form.as_p }}
                <button type="submit">REGISTER</button>
            </form>
            
            <div class="login-link">
                Already have an account? <a href="{% url 'login' %}">Login here</a>
            </div>
        </div>
    </div>
</body>
</html>
